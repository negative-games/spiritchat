changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
    authors:
      - github-actions[bot]
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - breaking
        - semver-major
    - title: Features
      labels:
        - feature
        - enhancement
        - feat
        - semver-minor
    - title: Fixes
      labels:
        - bug
        - fix
        - bugfix
        - regression
        - semver-patch
    - title: CI and Publishing
      labels:
        - ci
        - github-actions
        - modrinth
        - publishing
        - release
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Tests
      labels:
        - tests
        - testing
    - title: Maintenance
      labels:
        - chore
        - maintenance
        - dependencies
    - title: Other Changes
      labels:
        - "*"
